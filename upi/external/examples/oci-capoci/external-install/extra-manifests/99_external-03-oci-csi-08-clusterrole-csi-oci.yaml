# yamllint disable rule:indentation rule:brackets
#
# COPIED, NOT WRITTEN -- object 9 of 13 from Oracle's bundle.
#
#   source  oci-openshift/custom_manifests/oci-ccm-csi-drivers/v1.34.0/01-oci-csi.yml
#   sha256  f3af5c329e11a2272836856d29f3cc6f0af852ec0e84c79850b3c6538a858803
#   object  ClusterRole/csi-oci
#
# One object per file because the bootstrap node applies this directory one
# object per file and silently drops the rest of a multi-document one; the
# installer refuses such a file outright. See oci-ccm-csi-bundle.md in this
# directory for the full account: why these are day-0 while their config
# Secrets are not, what the two deltas against upstream are, and the
# partner-manifest supply-chain gap this bundle exposes.
#
# The yamllint disable is cosmetic only -- Oracle indents sequences and writes
# `[ "x" ]`, both of which this repository's .yamllint rejects. Reformatting a
# vendored file was tried and broke it; see oci-ccm-csi-bundle.md.
#
---
# oci-csi-09-node-rbac-cr.yaml
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
 name: csi-oci
 namespace: oci-csi
rules:
 - apiGroups: [""]
   resources: ["events"]
   verbs: ["get", "list", "watch", "create", "update", "patch"]
 - apiGroups: [""]
   resources: ["nodes"]
   verbs: ["get", "list", "watch"]
 - apiGroups: ["volume.oci.oracle.com"]
   resources: ["blockscsiinfos"]
   verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
 - apiGroups: [""]
   resources: ["persistentvolumes"]
   verbs: ["get", "list", "watch", "create", "delete", "patch"]
 - apiGroups: [""]
   resources: ["persistentvolumeclaims"]
   verbs: ["get", "list", "watch", "update", "create"]
 - apiGroups: ["storage.k8s.io"]
   resources: ["storageclasses", "volumeattachments", "volumeattachments/status", "csinodes"]
   verbs: ["get", "list", "watch", "patch"]
 - apiGroups: ["coordination.k8s.io"]
   resources: ["leases"]
   verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
 - apiGroups: [""]
   resources: ["endpoints"]
   verbs: ["get", "watch", "create", "update"]
 - apiGroups: [""]
   resources: ["pods"]
   verbs: ["get", "list", "watch"]
 - apiGroups: [""]
   resources: ["persistentvolumeclaims/status"]
   verbs: ["patch"]
 - apiGroups: [ "snapshot.storage.k8s.io" ]
   resources: [ "volumesnapshotclasses" ]
   verbs: [ "get", "list", "watch" ]
 - apiGroups: [ "snapshot.storage.k8s.io" ]
   resources: [ "volumesnapshotcontents" ]
   verbs: [ "create", "get", "list", "watch", "update", "delete", "patch" ]
 - apiGroups: [ "snapshot.storage.k8s.io" ]
   resources: [ "volumesnapshotcontents/status" ]
   verbs: [ "update", "patch" ]
 - apiGroups: [ "snapshot.storage.k8s.io" ]
   resources: [ "volumesnapshots" ]
   verbs: [ "get", "list", "watch", "update", "patch" ]
 - apiGroups: [ "snapshot.storage.k8s.io" ]
   resources: [ "volumesnapshots/status" ]
   verbs: [ "update", "patch" ]
 - apiGroups: [ "" ]
   resources: [ "serviceaccounts" ]
   verbs: [ "get", "list", "watch", "create" ]
